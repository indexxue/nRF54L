# ink_panel — EVT 冒烟：RTT 日志 + LED + nPM1300 + EPD bit-bang（无 BLE/NFC）

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
# 日志走 J-Link RTT（见 tmp/rtt）；省掉 UART 控制台
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_I2C=y

CONFIG_INK_PANEL_EPD=y
CONFIG_INK_PANEL_NFC=n

CONFIG_SOC_NRF_FORCE_CONSTLAT=y
CONFIG_LOG=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_START_REQUEST_HFXO=n

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000

CONFIG_APP_VERSION_STRING="0.0.0"
# ink_panel product_id = NVS_PROJECT_ID_INK_PANEL (0x53530130)
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x53530130

CONFIG_DK_LIBRARY=n
