# ink_panel — EVT：HFXO + LFXO + Zigbee ED + nPM/CAP1203
# Zigbee R23 add-on via NCS_ZIGBEE_ROOT；扫描掩码 11/15/20/25

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_I2C=y
# EPD 暂关；打开改 y（bit-bang；spi20 仍关：SPIM SCK 预置电平 Bus Fault）
CONFIG_INK_PANEL_EPD=n

# 片内 NFCT T2T 产测冒烟（固定 NDEF Text）；关改 n
CONFIG_INK_PANEL_NFC=y
CONFIG_NFC_T2T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_TEXT_RECORD=y

# 控制台 = uart00（TX=P2.02 / RX=P2.00）。RTT 先关。
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_RTT_CONSOLE=y

# 若改回 uart20 挂 P2 再开；uart00 与 P2 同域一般不需要
CONFIG_SOC_NRF_FORCE_CONSTLAT=y

CONFIG_LOG=n

# 低速：外置 32.768 kHz LFXO（X2 → P1.00/P1.01）。无晶振会卡启动，EVT 已装。
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# Zigbee/MPSL 接管 HFCLK；再手动 START_REQUEST_HFXO 会与 MPSL 死等。
CONFIG_START_REQUEST_HFXO=n

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x2000

CONFIG_APP_VERSION_STRING="0.0.0"
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x53530130

# --- Zigbee End Device ---
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x02108800
CONFIG_ZIGBEE_APP_TX_POWER=8
CONFIG_ZIGBEE_ED_MANUFACTURER="TY"
CONFIG_ZIGBEE_ED_MODEL="ink_panel"
CONFIG_ZIGBEE_ED_APP_VERSION=0x01

# ncs-zigbee v1.4 LTO prebuilts need GCC 14 (NCS 3.4). NCS 3.2/GCC12 → traces。
CONFIG_ZIGBEE_ENABLE_TRACES=y
CONFIG_LTO=n

CONFIG_DK_LIBRARY=n
CONFIG_ZIGBEE_FACTORY_RESET=n
