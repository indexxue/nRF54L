# Skeleton + TY rev_a smoke: UART console + dual LED + internal LFCLK RC

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y

# Prefer repo common/log.h macros; keep Zephyr LOG off to avoid macro clash if both included.
CONFIG_LOG=n

# Internal 32 kHz RC (no external LFXO). HF stays on HFINT until something requests HFXO.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Settings → settings_storage 32 KiB (+ boot_share 4 KiB in pm_static)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000

# Debug default; nrf.cmd release overrides via prj_version.conf
CONFIG_APP_VERSION_STRING="0.0.0"

# demo product_id = NVS_PROJECT_ID_DEMO (0x53530110)
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x53530110
