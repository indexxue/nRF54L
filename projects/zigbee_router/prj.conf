# zigbee_router — Zigbee Router + OnOff Server（由 zigbee_ed 分出；无 BLE/EPD）
# Zigbee R23 add-on via NCS_ZIGBEE_ROOT；扫描掩码对齐 ZigBridge-EM M5

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y
CONFIG_GPIO=y

# 诊断：UART 无输出时用 J-Link RTT Viewer 看日志（与 UART console 可并存）
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# Keep Zephyr LOG off so common/log.c log_init does not clash with log_core.c.
# Zigbee app_utils LOG_* become no-ops; app status uses common/log.h + printk.
CONFIG_LOG=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# Zigbee 启用 MPSL/802.15.4 后 HFCLK 由 MPSL 管；再手动 START_REQUEST_HFXO
# 会在 onoff_request 里与 MPSL 死等（PC 卡在 MPSL clock wait，无串口/无灯）。
# 联调勿开；与官方 light_bulb/template 一致，不额外要 HFXO。
CONFIG_START_REQUEST_HFXO=n

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Settings 8 KiB；其余原 32 KiB gap → zboss（见 pm_static.yml）
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x2000

CONFIG_APP_VERSION_STRING="0.0.0"
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x53530130

# --- Zigbee Router（对齐官方 light_bulb）---
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
# Multi-channel scan: must cover gateway ZNP_CHANNEL_MASK_DEFAULT (11/15/20/25)
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x02108800
# TX power (dBm) for mask channels; applied in lib/zigbee/zigbee_app.c
CONFIG_ZIGBEE_APP_TX_POWER=8

# ncs-zigbee v1.4 LTO prebuilts need GCC 14 (NCS 3.4). On NCS 3.2/GCC12 use
# trace (non-LTO) libs so link can succeed for bring-up.
CONFIG_ZIGBEE_ENABLE_TRACES=y
CONFIG_LTO=n

# No DK button lib; leave via app button + zb_bdb_reset_via_local_action
CONFIG_DK_LIBRARY=n
CONFIG_ZIGBEE_FACTORY_RESET=n
