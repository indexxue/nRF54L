# eink_tag — UART + LED + 按键 + SPI EPD + BLE（脚表 rev_b，见 doc/board_io_rev_b.md）
# LFCLK=内部 RC；HFCLK=外部 32 MHz HFXO（须起振，否则 start_boot 卡死无灯/无日志）

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_SPI=y

# Zephyr LOG 子系统关闭；业务日志走 common/log.h → printk
CONFIG_LOG=n

# LFCLK=内部 RC；HF=外部 HFXO
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_START_REQUEST_HFXO=y

# BLE 2.4G
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="eink_tag"
# nRF54L15 TX：默认 0 dBm → +8 dBm（芯片上限）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# 平面上传帧最大 244 B：抬高 ATT/ACL MTU，避免 Host 走 Prepare Write（易 Request Not Supported）
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_PREPARE_COUNT=0

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# 与 pm_static.yml 一致：32 KiB @ 0x15C000
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000

CONFIG_APP_VERSION_STRING="0.0.0"

# eink_tag product_id = NVS_PROJECT_ID_EINK_TAG (0x53530120)
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x53530120
