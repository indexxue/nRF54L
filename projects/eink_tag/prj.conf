# eink_tag — UART + LED + 按键 + SPI EPD(2.9" BWR)；内部 LFCLK RC
# NFC / BLE 暂关

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_LOG=n

# 内部 32 kHz RC（无外部 LFXO）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x9000

CONFIG_APP_VERSION_STRING="0.0.0"

# eink_tag product_id = NVS_PROJECT_ID_EINK_TAG (0x53530120)
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x53530120
