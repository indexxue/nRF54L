# eink_tag — UART + LED + 按键 + SPI EPD(2.9" BWR) + BLE 2.4G 广播
# LFCLK=内部 RC；HFCLK=外部 32 MHz HFXO（app 启动时请求）
# NFC 暂关（源码保留，未编入）

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_LOG=n

# 内部 32 kHz RC（无外部 LFXO）；HFXO 由 start_boot onoff 请求启用
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_START_REQUEST_HFXO=y

# BLE 2.4G 广播冒烟
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="eink_tag"
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x9000

CONFIG_APP_VERSION_STRING="0.0.0"

# eink_tag product_id = NVS_PROJECT_ID_EINK_TAG (0x53530120)
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x53530120
