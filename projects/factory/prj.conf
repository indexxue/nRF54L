# Skeleton: common log/cmd + NVS/Settings + UART console (no BLE / MCUBoot).

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_REBOOT=y

# Prefer repo common/log.h macros; keep Zephyr LOG off to avoid macro clash if both included.
CONFIG_LOG=n

# Settings → storage partition (flash_layout.md); PM needs settings_storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x9000

# Debug default; nrf.cmd release overrides via prj_version.conf
CONFIG_APP_VERSION_STRING="0.0.0"

# factory: product_id comes from NVS did (default 0)
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x0
