# factory — with MCUBoot (see sysbuild.conf + bootloader/).

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y

# IRQ-backed console RX for factory cmd (uart_poll_in every 10ms drops multi-byte lines).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=64

# Prefer repo common/log.h; Zephyr LOG off (symbol clash with common/src/log.c).
CONFIG_LOG=n

# TY rev_a: no external LFXO (DK default XTAL hangs before UART).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Factory pm_static: settings 8 KiB (rest of former 32 KiB gap → zboss_nvram).
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x2000

CONFIG_APP_VERSION_STRING="0.0.0"
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x0

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Zigbee: MPSL owns HFCLK — do not START_REQUEST_HFXO (deadlock risk).
CONFIG_START_REQUEST_HFXO=n

# --- Zigbee factory temp Coord / Router-DUT (single hex, soft-reset role) ---
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_COORDINATOR=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_SINGLE=y
CONFIG_ZIGBEE_CHANNEL=15
CONFIG_ZIGBEE_ENABLE_TRACES=y
CONFIG_LTO=n
CONFIG_DK_LIBRARY=n
CONFIG_ZIGBEE_FACTORY_RESET=n
