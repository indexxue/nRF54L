# factory — with MCUBoot (see sysbuild.conf + bootloader/).

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y

# IRQ-backed console RX for factory cmd (uart_poll_in every 10ms drops multi-byte lines).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=64

# Prefer repo common/log.h; Zephyr LOG off (symbol clash with common/src/log.c).
CONFIG_LOG=n

# TY rev_a: no external LFXO (DK default XTAL hangs before UART).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Match bootloader/pm_static.yml settings_storage (32 KiB).
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000

CONFIG_APP_VERSION_STRING="0.0.0"
CONFIG_NRF54_NVS_DEFAULT_DEVICE_ID=0x0
