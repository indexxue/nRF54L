# Shared MCUBoot Kconfig fragment (repo bootloader/).
# Applied via bootloader/sysbuild_include.cmake → mcuboot_EXTRA_CONF_FILE.
# Behavior: doc/flash_layout.md (64 KB boot, unsigned in development).
# Swap vs Direct XIP: per-app fragment (prj_swap_move.conf / prj_direct_xip.conf).

# Match flash_layout: mcuboot @ 0x000000, 64 KiB
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000

CONFIG_BOOT_UPGRADE_ONLY=n

# Development: no image signature. Production: switch via sysbuild / signed profile.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

CONFIG_FLASH=y
CONFIG_FPROTECT=n
CONFIG_CRC=y

CONFIG_MAIN_STACK_SIZE=10240
CONFIG_BOOT_MAX_IMG_SECTORS=256

# MULTITHREADING left unset here; nrf54l15 board fragment forces n (no GRTC).

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
CONFIG_MINIMAL_LIBC=y

CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"

# Factory bypass via boot_share (bootloader/hooks)
CONFIG_BOOT_GO_HOOKS=y

# Console on uart20 (pinmux in boards/*.overlay)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
