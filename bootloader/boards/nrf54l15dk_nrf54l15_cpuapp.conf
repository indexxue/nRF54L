# Board fragment for nrf54l15dk/nrf54l15/cpuapp (MCUBoot image).
# TY rev_a has no external LFXO — same as projects/*/prj.conf.

CONFIG_MAIN_STACK_SIZE=16384

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# SDK socs/nrf54l15 enables LTO by default; keep off (safer with custom hooks).
CONFIG_LTO=n

# Chainload hung AFTER "Jumping" inside GRTC sys_clock_elapsed (PC stayed in
# mcuboot). Match NCS nrf54l15 MCUBoot samples: no system timer in Boot.
# Requires MULTITHREADING=n (events.c needs timeouts when SYS_CLOCK_EXISTS=n).
CONFIG_MULTITHREADING=n
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_NRF_GRTC_TIMER=n
CONFIG_NRF_GRTC_START_SYSCOUNTER=n

CONFIG_BOOT_INTR_VEC_RELOC=y

# Skip UARTE teardown before jump (needs hooks/cleanup_compat.c stub).
CONFIG_MCUBOOT_NRF_CLEANUP_PERIPHERAL=n
