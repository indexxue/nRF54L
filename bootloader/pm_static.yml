# Canonical dual-slot Partition Manager map for MCUBoot (cpuapp RRAM).
# Addresses match doc/flash_layout.md. Apps copy/replace their pm_static.yml
# when enabling SB_CONFIG_BOOTLOADER_MCUBOOT -- do not use while still pre-MCUBoot.
#
# mcuboot             64 KiB @ 0x000000
# slot0 (primary)    664 KiB @ 0x010000  (pad 0x800 + app)
# slot1 (secondary)  664 KiB @ 0x0B6000  (pad 0x800 + secondary_app)  <- factory XIP
# settings_storage    32 KiB @ 0x15C000
# boot_share           4 KiB @ 0x164000
# FLPR reserved from 0x165000 (not listed; sysbuild CPUFLPR domain owns it)

mcuboot:
  address: 0x0
  region: flash_primary
  size: 0x10000

mcuboot_pad:
  address: 0x10000
  region: flash_primary
  size: 0x800

app:
  address: 0x10800
  region: flash_primary
  size: 0xa5800

mcuboot_primary:
  address: 0x10000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  size: 0xa6000
  span: *id001

mcuboot_primary_app:
  address: 0x10800
  orig_span: &id002
  - app
  region: flash_primary
  size: 0xa5800
  span: *id002

mcuboot_secondary:
  address: 0xb6000
  orig_span: &id003
  - mcuboot_secondary_pad
  - mcuboot_secondary_app
  region: flash_primary
  size: 0xa6000
  span: *id003

mcuboot_secondary_pad:
  address: 0xb6000
  region: flash_primary
  size: 0x800

mcuboot_secondary_app:
  address: 0xb6800
  region: flash_primary
  size: 0xa5800

settings_storage:
  address: 0x15c000
  region: flash_primary
  size: 0x8000

boot_share:
  address: 0x164000
  region: flash_primary
  size: 0x1000
